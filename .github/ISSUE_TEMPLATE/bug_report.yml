name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 简明描述发生了什么异常。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步一步说明如何复现。
      placeholder: |
        1. 打开 App
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为应该发生什么。
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 浏览器 / 系统 / 部署方式（GitHub Pages / Vercel / 本地 / APK）
      placeholder: Chrome 128 / Android 14 / GitHub Pages
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 控制台报错、相关截图（可粘贴或描述）。
    validations:
      required: false
